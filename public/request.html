<meta property="og:url" content="https://wreckly.ca/request.html">

<link rel="stylesheet" href="/style.css">
</head><body>
<div id="site-header"></div>

<section style="padding:40px 0 60px"><div class="wrap narrow">
  <div class="kicker">Free to ask</div>
  <h1 style="font-size:clamp(2rem,6vw,3.2rem)">Find my used auto part</h1>
  <p>Tell us what you need. We contact Ontario yards and email you who has it and the price. You only pay if you decide to reserve it.</p>
  <form id="f" class="formcard" novalidate>
    <div class="field"><label class="req" for="part">Part you need</label><input id="part" name="part" required maxlength="160" placeholder="e.g. Transmission, bumper, alternator, left headlight"></div>
    <div class="grid3">
      <div class="field"><label class="req" for="year">Year</label><select id="year" name="year" required><option value="">Select</option><option>2027</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2017</option><option>2016</option><option>2015</option><option>2014</option><option>2013</option><option>2012</option><option>2011</option><option>2010</option><option>2009</option><option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option><option>2000</option><option>1999</option><option>1998</option><option>1997</option><option>1996</option><option>1995</option><option>1994</option><option>1993</option><option>1992</option><option>1991</option><option>1990</option><option>1989</option><option>1988</option><option>1987</option><option>1986</option><option>1985</option><option>1984</option><option>1983</option><option>1982</option><option>1981</option><option>1980</option></select></div>
      <div class="field"><label class="req" for="make">Make</label><input id="make" name="make" list="makes" required maxlength="40" autocomplete="off"><datalist id="makes"><option value="Acura"><option value="Audi"><option value="BMW"><option value="Buick"><option value="Cadillac"><option value="Chevrolet"><option value="Chrysler"><option value="Dodge"><option value="Fiat"><option value="Ford"><option value="GMC"><option value="Genesis"><option value="Honda"><option value="Hyundai"><option value="Infiniti"><option value="Jaguar"><option value="Jeep"><option value="Kia"><option value="Land Rover"><option value="Lexus"><option value="Lincoln"><option value="Mazda"><option value="Mercedes-Benz"><option value="Mini"><option value="Mitsubishi"><option value="Nissan"><option value="Pontiac"><option value="Porsche"><option value="Ram"><option value="Saturn"><option value="Scion"><option value="Subaru"><option value="Suzuki"><option value="Tesla"><option value="Toyota"><option value="Volkswagen"><option value="Volvo"></datalist></div>
      <div class="field"><label class="req" for="model">Model</label><input id="model" name="model" required maxlength="60"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="vin">VIN <span style="font-weight:500;color:var(--mute)">(optional, helps match the part)</span></label><input id="vin" name="vin" maxlength="17" style="text-transform:uppercase"></div>
      <div class="field"><label class="req" for="postal">Postal code</label><input id="postal" name="postal" required maxlength="7" placeholder="M5V 2T6" autocomplete="postal-code"><div class="hint">We use it to find yards near you.</div></div>
    </div>
    <div class="field"><label for="notes">Anything else? <span style="font-weight:500;color:var(--mute)">(trim, engine size, colour, side&hellip;)</span></label><textarea id="notes" name="notes" maxlength="800"></textarea></div>
    <div class="grid2">
      <div class="field"><label class="req" for="name">Your name</label><input id="name" name="name" required maxlength="80" autocomplete="name"></div>
      <div class="field"><label class="req" for="email">Email</label><input id="email" name="email" type="email" required maxlength="120" autocomplete="email"></div>
    </div>
    <div class="field"><label for="phone">Phone <span style="font-weight:500;color:var(--mute)">(optional)</span></label><input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel"></div>
    <div class="hp" aria-hidden="true"><label>Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
    <div class="field"><label class="check"><input type="checkbox" id="terms" required><span>I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>. I understand Wreckly is an intermediary and the yard sells the part.</span></label></div>
    <button class="btn" id="go" type="submit">Send my request</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</div></section>

<div id="site-footer"></div>
<script src="/site.js"></script>
<script>
(function(){
  var f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
  function show(t,c){msg.className='msg '+c;msg.textContent=t}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d={};['part','year','make','model','vin','postal','notes','name','email','phone','website'].forEach(function(k){d[k]=f.elements[k].value.trim()});
    if(!d.part||!d.year||!d.make||!d.model||!d.postal||!d.name||!d.email){return show('Please fill in the required fields.','err')}
    if(!f.elements.terms.checked){return show('Please accept the Terms to continue.','err')}
    if(!/^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/.test(d.postal)){return show('Please enter a valid Canadian postal code (e.g. M5V 2T6).','err')}
    go.disabled=true;go.textContent='Sending...';
    wrecklyPost('/api/request',d).then(function(r){
      if(r.ok){
        try{fbq('track','Lead');gtag('event','generate_lead',{value:0,currency:'CAD'})}catch(e){}
        location.href='/thanks.html';
      } else {show(r.body.error||'Something went wrong. Please try again or email info@wreckly.ca.','err');go.disabled=false;go.textContent='Send my request'}
    }).catch(function(){show('Network error. Please try again.','err');go.disabled=false;go.textContent='Send my request'});
  });
})();
</script>
</body></html>
